{% extends 'base.html' %}

{% block content %}
<div class="form-wrapper">
    <div class="card form-card">
        <h2>Add Transaction</h2>
        <br>
        <form method="POST" action="{{ url_for('add') }}">
            <div class="form-group">
                <label>Type</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="type" value="income" required>
                        <span class="radio-custom income-radio">Income</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="type" value="expense" required checked>
                        <span class="radio-custom expense-radio">Expense</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required value="{{ now }}">
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" name="description" placeholder="What was this for?">
            </div>

            <br>
            <button type="submit" class="btn btn-primary btn-block">Save Transaction</button>
        </form>
    </div>
</div>
{% endblock %}
