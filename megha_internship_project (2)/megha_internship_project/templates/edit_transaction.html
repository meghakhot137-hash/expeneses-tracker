{% extends 'base.html' %}

{% block content %}
<div class="form-wrapper">
    <div class="card form-card">
        <h2>Edit Transaction</h2>
        <br>
        <form method="POST" action="{{ url_for('edit', id=transaction.id) }}">
            <div class="form-group">
                <label>Type</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="type" value="income" required {% if transaction.type == 'income' %}checked{% endif %}>
                        <span class="radio-custom income-radio">Income</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="type" value="expense" required {% if transaction.type == 'expense' %}checked{% endif %}>
                        <span class="radio-custom expense-radio">Expense</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required value="{{ transaction.date[:10] }}">
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" required placeholder="0.00" value="{{ transaction.amount }}">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled>Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if transaction.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" name="description" placeholder="What was this for?" value="{{ transaction.description or '' }}">
            </div>

            <br>
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update</button>
                <a href="{{ url_for('index') }}" class="btn" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
