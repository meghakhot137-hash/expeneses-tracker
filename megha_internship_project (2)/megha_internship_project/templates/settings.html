{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto; border: 1px solid var(--border); box-shadow: var(--shadow-lg);">
    <div style="padding: 1rem 0;">
        <h2 style="font-size: 1.5rem; color: #0f172a; font-weight: 700;">Account Settings</h2>
        <p style="color: var(--text-secondary); margin-top: 5px;">Manage your financial goals and preferences.</p>
    </div>
    <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 2rem;">

    <form method="POST" action="{{ url_for('settings') }}">
        <div class="form-group">
            <label for="budget" style="font-weight: 600; color: #334155;">Monthly Budget Allocation</label>
            <div style="position: relative; margin-top: 10px;">
                <span style="position: absolute; left: 15px; top: 12px; color: #94a3b8; font-weight: 600;">$</span>
                <input type="number" step="0.01" id="budget" name="budget" class="form-control" 
                       style="padding-left: 30px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 1.1rem; font-weight: 600;"
                       value="{{ user.monthly_budget if user.monthly_budget else 0.0 }}" required>
            </div>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 10px;">
                This budget will be used to track your spending progress on the dashboard.
            </p>
        </div>
        
        <div style="margin-top: 3rem; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; border: none; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);">
                Update Budget
            </button>
            <a href="{{ url_for('index') }}" class="btn" style="padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; background: #f8fafc; border: 1px solid #e2e8f0;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
